<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake · Minecraft 樱花湖畔</title>
<meta name="description" content="樱花湖畔、水上小城与雪山 —— 3D 体素场景 · WASD 漫游 · 落樱缤纷 · 可踩踏碰撞的方块世界。">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body { margin: 0; overflow: hidden; background: #3a7ad8; }

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; }

.hud {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hud-start {
  pointer-events: auto;
  text-align: center;
  padding: 28px 36px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(20px) saturate(140%);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.hud-start.hidden { opacity: 0; transform: scale(0.96); pointer-events: none; }

.hud-start h2 {
  margin: 0 0 8px;
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(90deg, #EC4899, #F5A8C9, #38BDF8);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hud-start p { margin: 0 0 18px; color: rgba(255, 255, 255, 0.88); font-size: 14px; }

.hud-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border-radius: 999px; border: none;
  background: linear-gradient(90deg, #EC4899, #F5A8C9);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.hud-btn:hover { opacity: 0.92; transform: translateY(-2px); }

.hud-keys {
  position: absolute; bottom: 28px; left: 28px;
  padding: 14px 18px; border-radius: 14px;
  background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  color: rgba(255, 255, 255, 0.85); font-size: 13px; line-height: 1.6;
  opacity: 0; transition: opacity 0.4s ease;
}
.hud-keys.visible { opacity: 1; }
.hud-keys kbd {
  display: inline-block; padding: 2px 6px; border-radius: 5px;
  background: rgba(255, 255, 255, 0.15); font-family: "JetBrains Mono", monospace;
  font-size: 12px; color: #fff;
}

.fly-badge {
  position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
  z-index: 105; padding: 6px 18px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 230, 160, 0.35);
  backdrop-filter: blur(10px);
  color: #ffe9a8; font-size: 13px; letter-spacing: 2px;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}
.fly-badge.on { opacity: 1; }

.title-chip {
  position: fixed; bottom: 24px; right: 24px; z-index: 110;
  padding: 12px 20px; border-radius: 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  color: var(--text-primary, #fff);
  text-align: right;
}
.title-chip h1 { margin: 0; font-size: 16px; font-weight: 700; }
.title-chip p { margin: 4px 0 0; font-size: 12px; color: rgba(255, 255, 255, 0.65); font-family: "JetBrains Mono", monospace; }

/* 加载错误提示 */
.load-error {
  position: fixed; top: 86px; left: 50%; transform: translateX(-50%); z-index: 120;
  padding: 10px 18px; border-radius: 12px;
  background: rgba(120, 20, 30, 0.75);
  border: 1px solid rgba(255, 120, 130, 0.4);
  backdrop-filter: blur(12px);
  color: #ffd9dc; font-size: 13px; text-align: center;
}

/* FPS 计数器 - 顶部菜单栏同款玻璃效果 */
.fps-hud {
  position: fixed; top: 8px; right: 8px; z-index: 9999;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  color: rgba(248, 250, 252, 0.92);
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; letter-spacing: 0.06em;
  pointer-events: none;
  user-select: none;
}

.fps-hud .fps-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4ade80; /* 默认绿色 = 流畅 */
  box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}

.fps-hud .fps-dot.warn { background: #fbbf24; box-shadow: 0 0 6px rgba(251, 191, 36, 0.6); }
.fps-hud .fps-dot.bad  { background: #f87171; box-shadow: 0 0 6px rgba(248, 113, 113, 0.6); }

.light-switch {
  position: fixed; top: 86px; right: 24px; z-index: 110;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(20, 16, 30, 0.38);
  backdrop-filter: blur(14px) saturate(150%);
  color: rgba(255, 255, 255, 0.92); font-size: 13px;
  font-family: inherit; cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  user-select: none;
}
.light-switch:hover { background: rgba(20, 16, 30, 0.55); transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.28); }
.light-switch svg { width: 15px; height: 15px; }
.light-switch .ls-label { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.06em; }

@media (max-width: 640px) {
  .light-switch { top: 78px; right: 14px; padding: 8px 13px; }
  .title-chip { display: none; }
}
</style>

    link.addEventListener('click', function() {
      sessionStorage.setItem('snake-skip-intro', '1');
    });
  });
  setTimeout(function() {

      var el = document.getElementById('loadError');
      if (el) { el.style.display = 'block'; el.textContent = '3D 场景启动失败，请 Ctrl+F5 强制刷新重试'; }
    }
  }, 5000);
  window.addEventListener('error', function(e) {
    var el = document.getElementById('loadError');
    if (el && e && e.message) { el.style.display = 'block'; el.textContent = '场景出错：' + e.message; }
  });

<script src="lib/three/three.min.js"></script>
<script src="lib/three/PointerLockControls.js"></script>
<script src="lib/three/Reflector.js"></script>

<script>
(function () {
'use strict';

var loadError = document.getElementById('loadError');
function showError(msg) {
  if (loadError) { loadError.style.display = 'block'; loadError.textContent = msg; }
}
if (typeof THREE === 'undefined') { showError('3D 引擎加载失败，请刷新重试'); return; }

var container = document.getElementById('canvas-container');

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaecdf0, 80, 280);

var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.75, 24);
// 调试：?spawn=x,y,z,yawDeg,pitchDeg 自定义出生点与朝向（供截图验证）
(function () {
  var m = location.search.match(/spawn=(-?[\d.]+),(-?[\d.]+),(-?[\d.]+)(?:,(-?[\d.]+))?(?:,(-?[\d.]+))?/);
  if (!m) return;
  camera.position.set(parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3]));
  if (m[4] !== undefined) camera.rotation.y = parseFloat(m[4]) * Math.PI / 180;
  if (m[5] !== undefined) camera.rotation.x = parseFloat(m[5]) * Math.PI / 180;
})();
// 调试：?nohud=1 隐藏开始面板（供截图验证）
if (location.search.indexOf('nohud=1') >= 0) {
  var _hs = document.getElementById('hudStart');
  if (_hs) _hs.style.display = 'none';
}
scene.add(camera);

var PR = Math.min(window.devicePixelRatio || 1, 1.25);

var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(PR);
renderer.setClearColor(0x3a7ad8, 1);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ---------- 控制 ----------
var controls = new THREE.PointerLockControls(camera, document.body);
var startBtn = document.getElementById('startBtn');
var hudStart = document.getElementById('hudStart');
var hudKeys = document.getElementById('hudKeys');

startBtn.addEventListener('click', function () { controls.lock(); });
container.addEventListener('click', function () { if (!controls.isLocked) controls.lock(); });

controls.addEventListener('lock', function () { hudStart.classList.add('hidden'); hudKeys.classList.add('visible'); });
controls.addEventListener('unlock', function () { hudStart.classList.remove('hidden'); hudKeys.classList.remove('visible'); });

var keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
window.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if (keys[k] !== undefined) keys[k] = true;
  if (e.code === 'Space') keys.space = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
  if (e.code === 'KeyF') toggleFly();
});
window.addEventListener('keyup', function (e) {
  var k = e.key.toLowerCase();
  if (keys[k] !== undefined) keys[k] = false;
  if (e.code === 'Space') keys.space = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
});

var velocity = new THREE.Vector3();
var canJump = false;
var moveSpeed = 9.0;
var jumpSpeed = 7.2;
var gravity = 22.0;
var fly = false;                 // 飞行模式开关
var FLY_SPEED = 16.0;            // 飞行速度
var landing = false;             // 降落动画进行中
var landingTargetY = 0;          // 降落目标相机高度
var LAND_SPEED = 26.0;           // 降落速度（单位/秒）

function toggleFly() {
  fly = !fly;
  landing = false;
  velocity.y = 0;
  canJump = false;
  var badge = document.getElementById('flyBadge');
  if (badge) badge.classList.toggle('on', fly);
}

// 求 (x,z) 处不高于 y 的最高实体方块顶（无则返回 null，表示落到水面 0）
function groundBelowY(x, y, z) {
  var x0 = x - PLAYER_HW, x1 = x + PLAYER_HW;
  var z0 = z - PLAYER_HW, z1 = z + PLAYER_HW;
  var best = null;
  for (var cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++) {
    for (var cz = Math.floor(z0 / CELL); cz <= Math.floor(z1 / CELL); cz++) {
      var arr = solidGrid.get(cx + '|' + cz);
      if (!arr) continue;
      for (var i = 0; i < arr.length; i++) {
        var a = arr[i];
        if (a.x0 < x1 && a.x1 > x0 && a.z0 < z1 && a.z1 > z0 && a.y1 <= y + 0.01) {
          if (best === null || a.y1 > best) best = a.y1;
        }
      }
    }
  }
  return best;
}

// 飞行时点击鼠标：垂直降落到正下方支撑面
function startLanding() {
  if (!fly || landing) return;
  var feetY = camera.position.y - EYE_H;
  var g = groundBelowY(camera.position.x, feetY, camera.position.z);
  var targetFeet = (g !== null) ? g : 0;
  var target = targetFeet + EYE_H;
  if (target >= camera.position.y - 0.01) {
    camera.position.y = target;
    fly = false; canJump = true; velocity.y = 0;
    var badge = document.getElementById('flyBadge');
    if (badge) badge.classList.remove('on');
    return;
  }
  landing = true;
  landingTargetY = target;
}

window.addEventListener('mousedown', function (e) {
  if (e.button === 0) startLanding();
});
var UP_VEC = new THREE.Vector3(0, 1, 0);
var fwdVec = new THREE.Vector3();
var rightVec = new THREE.Vector3();

// ---------- 灯光（晴日） ----------
var hemiLight = new THREE.HemisphereLight(0xcfe5ff, 0x8a9a7a, 1.0);
scene.add(hemiLight);

var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

var sunLight = new THREE.DirectionalLight(0xffffff, 1.9);
sunLight.position.set(30, 60, 40);
scene.add(sunLight);

// ---------- 程序化天空（GLSL，无任何贴图） ----------
var skyUniforms = {
  uHorizon:     { value: new THREE.Color(0xbcd8f8) },
  uZenith:      { value: new THREE.Color(0x2e6fd8) },
  uBelow:       { value: new THREE.Color(0x8aa8c8) },
  uSunColor:    { value: new THREE.Color(0xfffaf0) },
  uSunDir:      { value: new THREE.Vector3(0.3, 0.55, 0.35).normalize() },
  uCloudLit:    { value: new THREE.Color(0xffffff) },
  uCloudShadow: { value: new THREE.Color(0xb0c8e4) },
  uCloudAlpha:  { value: 0.9 },
  uCloudCover:  { value: 0.44 },
  uCloudScale:  { value: 0.85 },
  uCloudBright: { value: 0.78 },
  uStarMix:     { value: 0.0 },
  uTime:        { value: 0.0 }
};

var skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  vertexShader: [
    'varying vec3 vWorldPos;',
    'void main() {',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vWorldPos = wp.xyz;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n'),
  fragmentShader: [
    'uniform vec3 uHorizon;',
    'uniform vec3 uZenith;',
    'uniform vec3 uBelow;',
    'uniform vec3 uSunColor;',
    'uniform vec3 uSunDir;',
    'uniform vec3 uCloudLit;',
    'uniform vec3 uCloudShadow;',
    'uniform float uCloudAlpha;',
    'uniform float uCloudCover;',
    'uniform float uCloudScale;',
    'uniform float uCloudBright;',
    'uniform float uStarMix;',
    'uniform float uTime;',
    'varying vec3 vWorldPos;',
    '',
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p); vec2 f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),',
    '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float v = 0.0; float a = 0.5;',
    '  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 11.5; a *= 0.5; }',
    '  return v;',
    '}',
    '',
    'void main() {',
    '  vec3 dir = normalize(vWorldPos - cameraPosition);',
    '  float h = dir.y;',
    '',
    '  float t = pow(clamp(h, 0.0, 1.0), 0.5);',
    '  vec3 col = mix(uHorizon, uZenith, t);',
    '  if (h < 0.0) col = mix(uHorizon, uBelow, clamp(-h * 4.0, 0.0, 1.0));',
    '',
    '  float sd = max(dot(dir, normalize(uSunDir)), 0.0);',
    '  col += uSunColor * pow(sd, 600.0) * 4.0;',
    '  col += uSunColor * pow(sd, 24.0) * 0.30;',
    '  col += uSunColor * pow(sd, 6.0) * 0.12;',
    '',
    '  float horizonFade = smoothstep(0.02, 0.3, h);',
    '  vec2 cuv = dir.xz / max(h, 0.08) * uCloudScale;',
    '  cuv += vec2(uTime * 0.010, uTime * 0.004);',
    '  float c1 = fbm(cuv);',
    '  float c2 = fbm(cuv * 2.7 + 31.7 - uTime * 0.006);',
    '  float cloud = smoothstep(uCloudCover, uCloudCover + 0.22, c1 * 0.75 + c2 * 0.35);',
    '  float sunAmt = pow(sd, 2.0);',
    '  vec3 cloudCol = mix(uCloudShadow, uCloudLit, clamp(sunAmt * 1.4 + uCloudBright, 0.0, 1.0));',
    '  cloudCol = mix(cloudCol, uCloudShadow, smoothstep(0.72, 1.0, c1) * 0.35);',
    '  col = mix(col, cloudCol, cloud * horizonFade * uCloudAlpha);',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '  #include <tonemapping_fragment>',
    '  #include <colorspace_fragment>',
    '}'
  ].join('\n')
});

var sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 24), skyMat);
sky.renderOrder = -1;
scene.add(sky);

// ---------- 湖面（Reflector 镜面 + 波纹） ----------
var waterMirror = new THREE.Reflector(new THREE.CircleGeometry(340, 32), {
  clipBias: 0.0008,
  textureWidth: Math.floor(window.innerWidth * 0.25),
  textureHeight: Math.floor(window.innerHeight * 0.25),
  multisample: 0,
  color: 0x96b4ce
});
waterMirror.rotation.x = -Math.PI / 2;
waterMirror.position.y = 0;
waterMirror.material.uniforms.uRipple.value = 0.0024;
scene.add(waterMirror);

var waterTint = new THREE.Mesh(
  new THREE.CircleGeometry(340, 32),
  new THREE.MeshBasicMaterial({ color: 0x1a4a80, transparent: true, opacity: 0.10, depthWrite: false })
);
waterTint.rotation.x = -Math.PI / 2;
waterTint.position.y = 0.01;
waterTint.renderOrder = 1;
scene.add(waterTint);

// ---------- 像素纹理（Canvas 程序化生成） ----------
function createTexture(draw) {
  var c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  var ctx = c.getContext('2d');
  draw(ctx, 64);
  var tex = new THREE.CanvasTexture(c);

    '  // 宽度方向波浪（随高度与时间起伏）',
    '  float w1 = sin(pos.y * 1.4 + uTime * 2.6) * 0.20;',
    '  float w2 = sin(pos.y * 3.1 - uTime * 2.1 + uv.x * 6.0) * 0.10;',

// 生成一条流动水柱（交叉双平面 360° 可见 + 顶点细分让边缘不规则；flowUp 时水流向上；topWidth 控制上小下大的收口比例）
function addFlowingWater(px, pz, topY, bottomY, width, flowUp, topWidth) {
  var h = topY - bottomY;
  var geo = new THREE.PlaneGeometry(width, h, 16, 48);
  // 上小下大：把顶部顶点向中心收拢，底部保持全宽 → 瀑布向下自然散开
  if (topWidth === undefined) topWidth = 0.4;
  var posAttr = geo.attributes.position;
  var uvAttr = geo.attributes.uv;
  for (var i = 0; i < posAttr.count; i++) {
    var vv = uvAttr.getY(i); // v=0 顶部, v=1 底部
    var spread = topWidth + (1.0 - topWidth) * Math.pow(vv, 0.75);
    posAttr.setX(i, posAttr.getX(i) * spread);
  }
  posAttr.needsUpdate = true;
  if (flowUp) geo.rotateX(Math.PI);
  var a = new THREE.Mesh(geo, waterfallMat);
  var b = new THREE.Mesh(geo, waterfallMat);
  a.position.set(px, (topY + bottomY) / 2, pz);
  b.position.set(px, (topY + bottomY) / 2, pz);
  b.rotation.y = Math.PI / 2;
  scene.add(a); scene.add(b);
  return [a, b];
}

var CELL = 4;

function addSolid(x0, y0, z0, x1, y1, z1) {
  var box = { x0: x0, y0: y0, z0: z0, x1: x1, y1: y1, z1: z1 };
  for (var cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++) {
    for (var cz = Math.floor(z0 / CELL); cz <= Math.floor(z1 / CELL); cz++) {
      var key = cx + '|' + cz;
      var arr = solidGrid.get(key);
      if (!arr) { arr = []; solidGrid.set(key, arr); }
      arr.push(box);
    }
  }
}

function V(type, x, y, z, s) {
  var sc = s || 1;
  batch[type].push({ x: x, y: y, z: z, s: sc });
  if (SOLID_TYPES[type]) {
    var h = sc / 2;
    addSolid(x - h, y - h, z - h, x + h, y + h, z + h);
  }
}

var PLAYER_H = 1.9, PLAYER_HW = 0.35, EYE_H = 1.75, STEP_H = 0.55;
function collideAt(px, py, pz) {
  var x0 = px - PLAYER_HW, x1 = px + PLAYER_HW;
  var z0 = pz - PLAYER_HW, z1 = pz + PLAYER_HW;
  var topY = py + PLAYER_H;
  var out = null;
  for (var cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++) {
    for (var cz = Math.floor(z0 / CELL); cz <= Math.floor(z1 / CELL); cz++) {
      var arr = solidGrid.get(cx + '|' + cz);
      if (!arr) continue;
      for (var i = 0; i < arr.length; i++) {
        var a = arr[i];
        if (a.x0 < x1 && a.x1 > x0 && a.z0 < z1 && a.z1 > z0 && a.y0 < topY && a.y1 > py) {
          if (!out) out = [];
          out.push(a);

      }
    }
  }
  return out;
}

// 从碰撞列表里找可自动登上的台阶顶（高度差 <= STEP_H）
function stepTopFrom(hits, feetY) {
  var top = null;
  for (var i = 0; i < hits.length; i++) {
    var t = hits[i].y1;
    if (t > feetY - 0.001 && t - feetY <= STEP_H && (top === null || t > top)) top = t;
  }
  return top;
}

// 点是否落在实体方块内（花瓣停靠用）
function solidAtPoint(x, y, z) {
  var arr = solidGrid.get(Math.floor(x / CELL) + '|' + Math.floor(z / CELL));
  if (!arr) return null;
  for (var i = 0; i < arr.length; i++) {
    var a = arr[i];
    if (a.x0 <= x && a.x1 >= x && a.z0 <= z && a.z1 >= z && a.y0 <= y && a.y1 >= y) return a;
  }
  return null;
}

function valueNoise(x, z) {
  var n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function smoothNoise(x, z) {
  return (valueNoise(x, z) + valueNoise(x * 2.3 + 7.7, z * 2.3 + 3.1) * 0.5) / 1.5;
}

// ---------- 雪山（体素山峰） ----------
function mountain(cx, cz, H, R, snowRatio, striped) {
  var vs = 3; // 山体体素尺寸
  for (var mx = -R; mx <= R; mx += vs) {
    for (var mz = -R; mz <= R; mz += vs) {
      var dist = Math.sqrt(mx * mx + mz * mz);
      if (dist > R) continue;
      var h = H * Math.pow(1 - dist / R, 1.35) + (smoothNoise((cx + mx) * 0.15, (cz + mz) * 0.15) - 0.5) * H * 0.25;
      h = Math.max(0, Math.floor(h / vs) * vs);
      if (h < vs) continue;
      var snowLine = H * snowRatio + (smoothNoise(mx * 0.4, mz * 0.4) - 0.5) * H * 0.15;
      for (var my = 0; my < h; my += vs) {
        var type;
        if (striped) {
          type = (Math.floor(my / vs) % 3 === 0) ? 'snow' : 'stone';
        } else {
          type = my >= snowLine ? 'snow' : 'stone';
        }
        V(type, cx + mx, my + vs / 2, cz + mz, vs);
      }
    }
  }
}

function seaBridge() {

    for (var bw = -b.halfW; bw <= b.halfW; bw++) {

      if (bx % 2 === 0) V('lantern', bx, b.deckY + 1.6, b.z + s * b.halfW, 0.6);

  }

  // ---------- 桥墩（密集排列，像真实大桥） ----------
  var pierIdx = 0;
  for (var px = b.x0 + 5; px < b.x1; px += b.pierSpacing) {
    if (Math.abs(px - b.towerX[0]) < 6 || Math.abs(px - b.towerX[1]) < 6) continue; // 主塔位置跳过
    var pw = 1; // 桥墩半宽
    for (var pz = b.z - 2; pz <= b.z + 2; pz++) {

    var col = RAINBOW[pierIdx % RAINBOW.length];

    for (var py = 3; py < b.deckY - 1; py += 5) {

  // ---------- A 型桥塔（中国结风格：底部外扩，向上内收交叉） ----------

  for (var t = 0; t < 2; t++) {

    }
    // 航空警示灯
    V('lantern', tx, b.towerH + 1.5, b.z, 0.9);
    // 塔柱通体灯带（沿 A 型两柱一路亮到塔顶）
    for (var ly = 6; ly <= b.towerH; ly += 4) {
      var lratio = (ly - 1) / (b.towerH - 1);
      var lfz = frontZ + lratio * 3.0;
      var lbz = backZ - lratio * 3.0;
      V('lantern', tx - 1, ly + 0.4, Math.round(lfz), 0.55);
      V('lantern', tx + 1, ly + 0.4, Math.round(lbz), 0.55);
    }
    cableAnchors.push({ x: tx, y: b.towerH, z: b.z });
  }

  // ---------- 斜拉索（LineSegments） ----------
  var cablePositions = [];
  function addCable(x1, y1, z1, x2, y2, z2) {
    cablePositions.push(x1, y1, z1, x2, y2, z2);
  }
  for (var t = 0; t < 2; t++) {
    var anchor = cableAnchors[t];
    // 前后两面各拉索
    for (var side = -1; side <= 1; side += 2) {
      var cz = b.z + side * 3;
      // 主跨拉索（塔 → 对侧桥面）
      var otherTower = b.towerX[1 - t];
      var spanStart = Math.min(anchor.x, otherTower);
      var spanEnd   = Math.max(anchor.x, otherTower);
      var step = 5;
      for (var ax = spanStart + 3; ax < spanEnd - 2; ax += step) {
        if (Math.abs(ax - anchor.x) < 4) continue; // 塔根附近不拉索
        addCable(anchor.x, anchor.y, cz, ax, b.deckY + 0.5, cz);
      }
      // 边跨拉索（塔 → 桥端）
      var edgeDir = (t === 0) ? -1 : 1;
      var edgeStart = (t === 0) ? b.x0 : b.x1;
      for (var ax = anchor.x + edgeDir * 6; ax * edgeDir < edgeStart * edgeDir + 3; ax += edgeDir * step) {
        addCable(anchor.x, anchor.y, cz, ax, b.deckY + 0.5, cz);
      }
    }
  }
  if (cablePositions.length) {
    var cabGeo = new THREE.BufferGeometry();
    cabGeo.setAttribute('position', new THREE.Float32BufferAttribute(cablePositions, 3));
    var cabMat = new THREE.LineBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.7 });
    scene.add(new THREE.LineSegments(cabGeo, cabMat));
    // 斜拉索灯串：沿每根拉索间隔布灯，形成通体发光的索面
    for (var ci = 0; ci + 5 < cablePositions.length; ci += 6) {
      var x1 = cablePositions[ci],     y1 = cablePositions[ci + 1], z1 = cablePositions[ci + 2];
      var x2 = cablePositions[ci + 3], y2 = cablePositions[ci + 4], z2 = cablePositions[ci + 5];
      var segLen = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1) + (z2 - z1) * (z2 - z1));
      var n = Math.max(2, Math.floor(segLen / 5));
      for (var sii = 1; sii < n; sii++) {
        var tt = sii / n;
        V('lantern', x1 + (x2 - x1) * tt, y1 + (y2 - y1) * tt, z1 + (z2 - z1) * tt, 0.42);
      }
    }
  }

  // ---------- 真实点光源（塔顶高亮，让 A 型塔在夜里真正亮起来） ----------
  warmLight(b.towerX[0], b.towerH + 3, b.z, 1.4, 75);
  warmLight(b.towerX[1], b.towerH + 3, b.z, 1.4, 75);
}

// ---------- 浮空樱花神殿（壮观地标：悬于城市上空，带瀑布、天梯与光柱） ----------
function floatingIsland(cx, cz) {
  var topY = 34;
  var radiusX = 20, radiusZ = 16;

  // 岛顶草地与岛体（内部空心，只保留顶 2 层 + 边缘支撑，省体素）
  // 水电梯出口位置（ex=cx+13, ez=cz-11）上方留空，让玩家能从水流中被推到岛上
  var shaftHoleX = 13, shaftHoleZ = -11;
  for (var dx = -radiusX; dx <= radiusX; dx++) {
    for (var dz = -radiusZ; dz <= radiusZ; dz++) {
      var d = Math.sqrt((dx / radiusX) * (dx / radiusX) + (dz / radiusZ) * (dz / radiusZ));
      if (d > 1) continue;
      var edge = d > 0.75;
      var inner = Math.abs(dx) < radiusX - 3 && Math.abs(dz) < radiusZ - 3;
      var isShaftExit = dx === shaftHoleX && dz === shaftHoleZ;

      if (!isShaftExit) {
        V('grass', cx + dx, topY + 0.5, cz + dz);
        V('dirt', cx + dx, topY - 0.5, cz + dz);
      }
      if ((edge || !inner) && !isShaftExit) {
        V('stone', cx + dx, topY - 1.5, cz + dz);
        V('stone', cx + dx, topY - 2.5, cz + dz);
      }

      // 岛底垂云（随机下垂）
      if (Math.random() < 0.05 && d < 0.8) {
        var hang = 2 + Math.floor(Math.random() * 5);
        for (var hy = 1; hy <= hang; hy++) {
          V('cloud', cx + dx, topY - 2.5 - hy + 0.5, cz + dz, 0.7 + Math.random() * 0.4);
        }
      }
    }
  }

  // 岛底云层（蓬松封闭底部，从下方仰望不会穿洞）
  for (var dx = -radiusX; dx <= radiusX; dx++) {
    for (var dz = -radiusZ; dz <= radiusZ; dz++) {
      var d = Math.sqrt((dx / radiusX) * (dx / radiusX) + (dz / radiusZ) * (dz / radiusZ));
      if (d > 0.92) continue;
      if (Math.random() < 0.75) {
        V('cloud', cx + dx, topY - 3.5, cz + dz, 0.85 + Math.random() * 0.35);
      }
    }
  }

  // 神殿基座平台
  var baseY = topY + 1;
  for (var tx = -8; tx <= 8; tx++) {
    for (var tz = -8; tz <= 8; tz++) {
      var onEdge = Math.abs(tx) === 8 || Math.abs(tz) === 8;
      var corner = Math.abs(tx) === 8 && Math.abs(tz) === 8;
      if (corner) {
        V('stone', cx + tx, baseY + 0.5, cz + tz);
      } else if (onEdge) {
        V('tile', cx + tx, baseY + 0.5, cz + tz);
      } else {
        V('plank', cx + tx, baseY + 0.5, cz + tz);
      }
    }
  }

  // 神殿四柱（云杉木）
  var posts = [[-7, -7], [7, -7], [-7, 7], [7, 7]];
  for (var pi = 0; pi < posts.length; pi++) {
    for (var ph = 1; ph <= 6; ph++) {
      V('spruce', cx + posts[pi][0], baseY + ph + 0.5, cz + posts[pi][1]);
    }
  }

  // 神殿顶框
  for (var bx = -8; bx <= 8; bx++) {
    V('tile', cx + bx, baseY + 7.5, cz - 8);
    V('tile', cx + bx, baseY + 7.5, cz + 8);
  }
  for (var bz = -7; bz <= 7; bz++) {
    V('tile', cx - 8, baseY + 7.5, cz + bz);
    V('tile', cx + 8, baseY + 7.5, cz + bz);
  }

  // 屋顶瓦片（向内收缩三层）
  for (var layer = 0; layer <= 2; layer++) {
    var r = 8 - layer;
    var ly = baseY + 8 + layer;
    for (var rx = -r; rx <= r; rx++) {
      for (var rz = -r; rz <= r; rz++) {
        V('tile', cx + rx, ly + 0.5, cz + rz);
      }
    }
  }

  // 巨型樱花神树（3×3 树干，半球形大树冠）
  var trunkH = 13;
  for (var tx = -1; tx <= 1; tx++) {
    for (var tz = -1; tz <= 1; tz++) {
      for (var ty = 1; ty <= trunkH; ty++) {
        V('trunk', cx + tx, baseY + ty - 0.5, cz + tz);
      }
    }
  }
  var crownY = baseY + trunkH + 1;
  for (var dx = -8; dx <= 8; dx++) {
    for (var dy = -2; dy <= 5; dy++) {
      for (var dz = -8; dz <= 8; dz++) {
        var d = Math.sqrt(dx * dx + dy * dy * 1.4 + dz * dz);
        if (d <= 7.5 && Math.random() > 0.06) {
          V('cherry', cx + dx, crownY + dy, cz + dz);
        }
      }

  }

  // 瀑布：3 条从岛边缘垂落的流动水（上小下大、透明分股，直落到湖面接触地面）
  addFlowingWater(cx + radiusX, cz, topY, 0.0, 2.6, false, 0.30);
  addFlowingWater(cx - radiusX, cz, topY, 0.0, 2.0, false, 0.38);
  addFlowingWater(cx, cz + radiusZ, topY, 0.0, 3.0, false, 0.32);

  // 螺旋天梯：从湖面到浮岛
  var stairR = 3.5, stairCX = cx + 20, stairCZ = cz + 4;
  var turns = 3.5, steps = 84;
  for (var si = 0; si <= steps; si++) {
    var t = si / steps;
    var ang = t * turns * Math.PI * 2;
    var sx = stairCX + Math.cos(ang) * stairR;
    var sz = stairCZ + Math.sin(ang) * stairR;
    var sy = 0.5 + t * (topY - 1.5);
    V('stone', sx, sy, sz, 0.9);
    if (si % 5 === 0) V('spruce', sx, sy + 1, sz, 0.3);
  }

  // 岛上种满小樱花树（避开中央神殿/神树、电梯出口、天梯、瀑布）
  var treeCount = 0, treeTries = 0;
  while (treeCount < 26 && treeTries < 600) {

    var tdz = Math.round((Math.random() * 2 - 1) * (radiusZ - 2));
    var td = Math.sqrt((tdx / radiusX) * (tdx / radiusX) + (tdz / radiusZ) * (tdz / radiusZ));
    if (td > 0.9) continue;                       // 太靠边，容易悬空
    if (Math.abs(tdx) <= 10 && Math.abs(tdz) <= 10) continue;   // 中央神殿 + 巨型神树区
    if (tdx === shaftHoleX && tdz === shaftHoleZ) continue;      // 水电梯出口
    if (Math.abs(tdx - 20) <= 4 && Math.abs(tdz - 4) <= 4) continue; // 螺旋天梯终点区
    if ((tdx === 20 && tdz === 0) || (tdx === -20 && tdz === 0) || (tdx === 0 && tdz === 16)) continue; // 三条瀑布

  var beamGeo = new THREE.CylinderGeometry(0.25, 3.2, 50, 20, 1, true);

  // 水电梯塔：从湖面直达浮岛（中心水流推动玩家上升）
  var ex = cx + 13, ez = cz - 11;
  var shaftTop = topY + 1;
  for (var ey = 1; ey <= shaftTop; ey++) {
    for (var dx = -1; dx <= 1; dx++) {
      for (var dz = -1; dz <= 1; dz++) {
        var isCenter = dx === 0 && dz === 0;
        var isCorner = Math.abs(dx) === 1 && Math.abs(dz) === 1;
        var isSouthEntrance = dx === 0 && dz === -1; // 南侧留出入口
        if (isCenter) {
          // 底部中心是实体地板，上面才是水流（水柱用流动平面单独生成）
          if (ey === 1) {
            V('stone', ex, ey + 0.5, ez);
          }
        } else if (isCorner) {
          V('spruce', ex + dx, ey + 0.5, ez + dz);
        } else if (!isSouthEntrance) {
          V('glass', ex + dx, ey + 0.5, ez + dz);
        }
      }
    }
  }
  // 中心水柱：向上流动的真水（推动玩家上升，均匀水柱不收口）
  addFlowingWater(ex, ez, shaftTop + 0.5, 1.5, 1.0, true, 1.0);

  // 南侧引桥：3 格宽石路通到电梯入口，方便玩家走进来
  for (var bi = 1; bi <= 3; bi++) {

    V('stone', ex + 1, 0.5, ez - bi);

  // 底部入口平台（中心与井道底部实体地板相连）
  for (var dx = -2; dx <= 2; dx++) {
    for (var dz = -2; dz <= 2; dz++) {

function house(x0, z0, x1, z1, doorX) {
  for (var x = x0; x <= x1; x++) {
    for (var z = z0; z <= z1; z++) {
      if (!(x === x0 || x === x1 || z === z0 || z === z1)) continue;
      var corner = (x === x0 || x === x1) && (z === z0 || z === z1);
      for (var y = 2; y <= 4; y++) {
        if (z === z1 && x === doorX && y <= 3) continue; // 门洞（2 格高，可走进屋）
        var type = corner ? 'spruce' : 'plank';
        if (!corner && y === 3 && ((x + z) % 2 + 2) % 2 === 0 && z !== z1) type = 'glass';
        V(type, x, y + 0.5, z);
      }
    }
  }
  V('lantern', Math.floor((x0 + x1) / 2), 4.5, Math.floor((z0 + z1) / 2));
  var rx0 = x0 - 1, rz0 = z0 - 1, rx1 = x1 + 1, rz1 = z1 + 1, ry = 5.5, first = true;
  while (rx0 <= rx1 && rz0 <= rz1) {
    for (var x = rx0; x <= rx1; x++) {
      for (var z = rz0; z <= rz1; z++) {
        var edge = (x === rx0 || x === rx1 || z === rz0 || z === rz1);
        if (first || edge || rx1 - rx0 <= 1 || rz1 - rz0 <= 1) V('tile', x, ry, z);

    first = false; rx0++; rz0++; rx1--; rz1--; ry += 1;

// ---------- 生成 InstancedMesh ----------
function buildInstanced(material, arr) {
  if (arr.length === 0) return;
  var mesh = new THREE.InstancedMesh(voxelGeo, material, arr.length);
  var dummy = new THREE.Object3D();
  for (var i = 0; i < arr.length; i++) {
    dummy.position.set(arr[i].x, arr[i].y, arr[i].z);
    dummy.scale.setScalar(arr[i].s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

buildInstanced(lanternMat, batch.lantern);
buildInstanced(glassMat, batch.glass);
buildInstanced(cloudMat, batch.cloud);

// ---------- 五彩装饰灯（桥墩彩虹灯，按颜色各一个 InstancedMesh） ----------
for (var ckey in colorLanterns) {
  var carr = colorLanterns[ckey];
  var chex = parseInt(ckey, 16);
  var cmat = new THREE.MeshStandardMaterial({ color: chex, emissive: chex, emissiveIntensity: 1.8, roughness: 0.5 });
  buildInstanced(cmat, carr);
}

// ---------- 右上角樱花枝（挂在镜头上） ----------
var branch = new THREE.Group();
var stick = [
  [0, 0, 0], [0.4, 0.35, 0], [0.8, 0.65, -0.05], [1.2, 0.9, -0.1], [1.55, 1.1, -0.15]
];
stick.forEach(function (p) {
  var m = new THREE.Mesh(voxelGeo, trunkMat);
  m.position.set(p[0], p[1], p[2]);
  m.scale.setScalar(0.35);
  branch.add(m);
});
var blossomSpots = [
  [1.7, 1.35, -0.2], [2.0, 1.15, -0.1], [1.45, 1.6, -0.25], [1.9, 1.55, -0.3],
  [1.25, 1.3, -0.1], [2.15, 1.4, -0.2], [1.6, 0.95, -0.05], [1.3, 1.75, -0.2],
  [0.9, 1.0, 0], [0.55, 0.7, 0.05]
];
blossomSpots.forEach(function (p) {
  var m = new THREE.Mesh(voxelGeo, cherryMat);
  m.position.set(p[0], p[1], p[2]);
  m.scale.setScalar(0.42 + Math.random() * 0.15);
  branch.add(m);
});
// 垂落的花瓣块
for (var bi = 0; bi < 5; bi++) {
  var hang = new THREE.Mesh(voxelGeo, cherryMat);
  hang.position.set(1.2 + Math.random() * 0.9, 0.5 - Math.random() * 0.5, -0.15);
  hang.scale.setScalar(0.3 + Math.random() * 0.1);
  branch.add(hang);
}
branch.position.set(0.85, 0.5, -1.35);
branch.rotation.set(0.05, -0.35, -0.1);
branch.scale.setScalar(0.32);
camera.add(branch);

// ---------- 落樱（樱瓣随风飘落，会停在方块顶与水面上） ----------
// 浮空岛参数（供樱花雨在岛上方飘落并停在岛顶）
var ISLAND = { cx: 22, cz: -18, topY: 34, radiusX: 20, radiusZ: 16 };
var PETAL_COUNT = 90;
var petalMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.24, 0.07, 0.24),
  new THREE.MeshStandardMaterial({ roughness: 0.85, side: THREE.DoubleSide }),
  PETAL_COUNT
);
petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
petalMesh.castShadow = false;
petalMesh.receiveShadow = false;
var petalDummy = new THREE.Object3D();
var petalColor = new THREE.Color();
var PETAL_COLORS = [0xF3A8C6, 0xEE9DBE, 0xF7B5CE, 0xFFC4DA, 0xF9CBDD];
var petals = [];

function petalReset(p, initial) {
  var r = Math.random();
  if (r < 0.36) {          // 浮空岛上空（樱花雨核心场景）
    p.x = ISLAND.cx + (Math.random() - 0.5) * (ISLAND.radiusX * 2 + 6);
    p.z = ISLAND.cz + (Math.random() - 0.5) * (ISLAND.radiusZ * 2 + 6);
    p.y = initial ? ISLAND.topY + 2 + Math.random() * 20 : ISLAND.topY + 2 + Math.random() * 20;
  } else if (r < 0.55) {   // 水上小城一带
    p.x = -20 + (Math.random() - 0.5) * 30;
    p.z = -14 + (Math.random() - 0.5) * 22;
  } else if (r < 0.82) {   // 岸边樱花树带
    p.x = (Math.random() - 0.5) * 120;
    p.z = -38 + (Math.random() - 0.5) * 9;
  } else {                 // 玩家身边
    p.x = camera.position.x + (Math.random() - 0.5) * 44;
    p.z = camera.position.z + (Math.random() - 0.5) * 44;
  }
  if (r >= 0.36) p.y = initial ? Math.random() * 14 : 9 + Math.random() * 7;
  p.vy = 0.7 + Math.random() * 0.9;
  p.phase = Math.random() * Math.PI * 2;
  p.swayA = 0.5 + Math.random() * 0.9;
  p.swayW = 0.8 + Math.random() * 1.6;
  p.ax = Math.random() * Math.PI * 2; p.ay = Math.random() * Math.PI * 2; p.az = Math.random() * Math.PI * 2;
  p.srx = (Math.random() - 0.5) * 3; p.sry = (Math.random() - 0.5) * 3; p.srz = (Math.random() - 0.5) * 3;
  p.s = 0.7 + Math.random() * 0.6;
  p.rest = 0;
}

for (var pi = 0; pi < PETAL_COUNT; pi++) {
  var pp = {};
  petalReset(pp, true);
  petals.push(pp);
  petalMesh.setColorAt(pi, petalColor.setHex(PETAL_COLORS[pi % PETAL_COLORS.length]).offsetHSL(0, 0, (Math.random() - 0.5) * 0.05));
}
if (petalMesh.instanceColor) petalMesh.instanceColor.needsUpdate = true;
scene.add(petalMesh);

function updatePetals(delta) {
  var wind = 0.5 + Math.sin(simTime * 0.25) * 0.5;
  var dirty = false;
  for (var i = 0; i < PETAL_COUNT; i++) {
    var pt = petals[i];
    if (pt.rest > 0) {
      pt.rest -= delta;
      if (pt.rest <= 0) {
        petalReset(pt, false);
        dirty = true;                 // 重生后需要更新矩阵
      }
      continue;                       // 静止花瓣跳过矩阵更新，省大量 CPU
    }

    var ny = pt.y - pt.vy * delta;
    var landed = false;

    // 碰撞检测优化：低空时才查体素网格（灯塔顶 y≈13、浮空岛顶 y≈35，上限放宽到 45 覆盖全场景）
    if (ny <= 45) {
      var hit = solidAtPoint(pt.x, ny, pt.z);
      if (hit) {                      // 落在方块顶（甲板、屋顶、树冠、岛顶草地上）
        pt.y = hit.y1 + 0.05;
        pt.rest = 2.5 + Math.random() * 3;
        landed = true;
      } else if (ny <= 0.03) {        // 落在水面
        pt.y = 0.05;
        pt.rest = 2.5 + Math.random() * 3;
        landed = true;
      }
    }

    if (!landed) {
      pt.y = ny;
      pt.x += (Math.sin(simTime * pt.swayW + pt.phase) * pt.swayA + wind) * delta;
      pt.z += Math.cos(simTime * pt.swayW * 0.7 + pt.phase) * pt.swayA * 0.6 * delta;
      pt.ax += pt.srx * delta; pt.ay += pt.sry * delta; pt.az += pt.srz * delta;
    }

    petalDummy.position.set(pt.x, pt.y, pt.z);
    petalDummy.rotation.set(pt.ax, pt.ay, pt.az);
    petalDummy.scale.setScalar(pt.s);
    petalDummy.updateMatrix();
    petalMesh.setMatrixAt(i, petalDummy.matrix);
    dirty = true;
  }
  if (dirty) petalMesh.instanceMatrix.needsUpdate = true;
}

// ---------- 光影模式（晴日 / 日落） ----------
var lsLabel = document.getElementById('lsLabel');
var lsIcon = document.getElementById('lsIcon');
var ICONS = {
  day: '<circle cx="12" cy="12" r="5"></circle><path d="M12 1v3M12 20v3M3.5 12h3M17.5 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path>',
  sunset: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>'
};
var MODES = [
  { label: '晴日', icon: 'day', exposure: 1.2,
    sky: { horizon: 0xbcd8f8, zenith: 0x2e6fd8, below: 0x8aa8c8, sun: 0xfffaf0, sunDir: [0.3, 0.55, 0.35], cloudLit: 0xffffff, cloudShadow: 0xb0c8e4, cloudAlpha: 0.9, cover: 0.44, scale: 0.85, bright: 0.78, starMix: 0 },
    fog: [0xaecdf0, 80, 500], hemi: [0xcfe5ff, 0x8a9a7a, 1.0], amb: [0xffffff, 0.5], sunL: [0xffffff, 1.9, [30, 60, 40]], water: 0x96b4ce, tint: [0x1a4a80, 0.10] },
  { label: '日落', icon: 'sunset', exposure: 1.05,
    sky: { horizon: 0xffa86a, zenith: 0x443a7a, below: 0x3a2c42, sun: 0xffd9a0, sunDir: [0, 0.16, -0.98], cloudLit: 0xffc89a, cloudShadow: 0x8a6a90, cloudAlpha: 0.8, cover: 0.42, scale: 1.1, bright: 0.35, starMix: 0 },
    fog: [0xc07850, 90, 520], hemi: [0xffc088, 0x3a2a20, 0.75], amb: [0xffcf9a, 0.38], sunL: [0xffc080, 1.25, [-30, 30, -40]], water: 0x9a7a74, tint: [0x2a1e30, 0.16] }
];
// 默认日落；记住上次选择，下次打开自动恢复
var MODE_KEY = 'snake-mc-light-mode';
var savedMode = null;
try { savedMode = parseInt(localStorage.getItem(MODE_KEY), 10); } catch (e) {}
if (isNaN(savedMode) || savedMode < 0 || savedMode >= MODES.length) savedMode = 1; // 首次打开默认日落
var modeIdx = savedMode;
function applyMode(m) {
  renderer.toneMappingExposure = m.exposure;
  skyUniforms.uHorizon.value.setHex(m.sky.horizon);
  skyUniforms.uZenith.value.setHex(m.sky.zenith);
  skyUniforms.uBelow.value.setHex(m.sky.below);
  skyUniforms.uSunColor.value.setHex(m.sky.sun);
  skyUniforms.uSunDir.value.set(m.sky.sunDir[0], m.sky.sunDir[1], m.sky.sunDir[2]).normalize();
  skyUniforms.uCloudLit.value.setHex(m.sky.cloudLit);
  skyUniforms.uCloudShadow.value.setHex(m.sky.cloudShadow);
  skyUniforms.uCloudAlpha.value = m.sky.cloudAlpha;
  skyUniforms.uCloudCover.value = m.sky.cover;
  skyUniforms.uCloudScale.value = m.sky.scale;
  skyUniforms.uCloudBright.value = m.sky.bright;
  skyUniforms.uStarMix.value = m.sky.starMix;
  scene.fog.color.setHex(m.fog[0]); scene.fog.near = m.fog[1]; scene.fog.far = m.fog[2];
  hemiLight.color.setHex(m.hemi[0]); hemiLight.groundColor.setHex(m.hemi[1]); hemiLight.intensity = m.hemi[2];
  ambientLight.color.setHex(m.amb[0]); ambientLight.intensity = m.amb[1];
  sunLight.color.setHex(m.sunL[0]); sunLight.intensity = m.sunL[1];
  sunLight.position.set(m.sunL[2][0], m.sunL[2][1], m.sunL[2][2]);
  waterMirror.material.uniforms.color.value.setHex(m.water);
  waterTint.material.color.setHex(m.tint[0]);
  waterTint.material.opacity = m.tint[1];
  lsLabel.textContent = m.label;
  lsIcon.innerHTML = ICONS[m.icon];
}
applyMode(MODES[modeIdx]);
document.getElementById('lightSwitch').addEventListener('click', function () {
  modeIdx = (modeIdx + 1) % MODES.length;
  applyMode(MODES[modeIdx]);
  try { localStorage.setItem(MODE_KEY, String(modeIdx)); } catch (e) {}
});

// ---------- 动画 ----------
var clock = new THREE.Clock();
var simTime = 0;
var fpsDiv = document.createElement('div');
fpsDiv.className = 'fps-hud';
fpsDiv.setAttribute('aria-label', '当前帧率');
fpsDiv.setAttribute('role', 'status');
var fpsDot = document.createElement('span');
fpsDot.className = 'fps-dot';
var fpsSpan = document.createElement('span');
fpsSpan.textContent = '--';
fpsDiv.appendChild(fpsDot);
fpsDiv.appendChild(document.createTextNode('FPS: '));
fpsDiv.appendChild(fpsSpan);
document.body.appendChild(fpsDiv);
var frameCount = 0, lastFpsTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  var delta = Math.min(clock.getDelta(), 0.1);
  simTime += delta;

  skyUniforms.uTime.value = simTime;
  waterMirror.material.uniforms.uTime.value = simTime;
  waterfallUniforms.uTime.value = simTime;

  // 樱花枝轻微摇曳
  branch.rotation.z = -0.1 + Math.sin(simTime * 0.8) * 0.02;

  // 玩家移动（体素碰撞：撞墙不穿模，遇 <=0.55 的台阶自动登上）
  if (controls.isLocked) {
    // 依相机朝向计算前/右方向
    fwdVec.set(0, 0, -1).applyQuaternion(camera.quaternion);
    fwdVec.y = 0;
    if (fwdVec.lengthSq() > 0.0001) fwdVec.normalize();
    rightVec.crossVectors(fwdVec, UP_VEC).normalize();

    var mf = Number(keys.w) - Number(keys.s);
    var mr = Number(keys.d) - Number(keys.a);

    if (fly) {
      if (landing) {
        // 降落：垂直下落，到目标后退出飞行恢复行走
        camera.position.y -= LAND_SPEED * delta;
        if (camera.position.y <= landingTargetY) {
          camera.position.y = landingTargetY;
          landing = false;
          fly = false; canJump = true; velocity.y = 0;
          var lbadge = document.getElementById('flyBadge');
          if (lbadge) lbadge.classList.remove('on');
        }
      } else {
        // 飞行模式：无视重力与碰撞，自由升降
        var look = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        var mv = Number(keys.space) - Number(keys.shift);
        var dir = new THREE.Vector3();
        dir.addScaledVector(look, mf);
        dir.addScaledVector(rightVec, mr);
        dir.y += mv;
        if (dir.lengthSq() > 0.0001) dir.normalize();
        camera.position.addScaledVector(dir, FLY_SPEED * delta);
      }

      // 飞行高度与活动范围（可飞越海面去看跨海大桥）
      if (camera.position.y < 1.5) camera.position.y = 1.5;
      if (camera.position.y > 190) camera.position.y = 190;
      var frr = Math.sqrt(camera.position.x * camera.position.x + camera.position.z * camera.position.z);
      if (frr > 320) {
        camera.position.x *= 320 / frr;
        camera.position.z *= 320 / frr;
      }
    } else {
      velocity.x -= velocity.x * 8.0 * delta;
      velocity.z -= velocity.z * 8.0 * delta;
      velocity.y -= gravity * delta;

      if (mf !== 0 || mr !== 0) {
        var ml = Math.sqrt(mf * mf + mr * mr); mf /= ml; mr /= ml;
        velocity.addScaledVector(fwdVec, mf * moveSpeed * 10 * delta);
        velocity.addScaledVector(rightVec, mr * moveSpeed * 10 * delta);
      }

      var feetY = camera.position.y - EYE_H;
      var wantsMove = keys.w || keys.a || keys.s || keys.d;
      var hasHorizontalVelocity = Math.abs(velocity.x) > 0.01 || Math.abs(velocity.z) > 0.01;

      // X 轴移动：撞方块则尝试自动登台阶（静止看风景时跳过，省 CPU）
      var dxv = velocity.x * delta;
      if (dxv !== 0 && (wantsMove || hasHorizontalVelocity)) {
        var nxp = camera.position.x + dxv;
        var hitsX = collideAt(nxp, feetY, camera.position.z);
        if (!hitsX) {
          camera.position.x = nxp;
        } else {
          var stX = stepTopFrom(hitsX, feetY);
          if (stX !== null && !collideAt(nxp, stX, camera.position.z)) {
            camera.position.x = nxp;
            feetY = stX;
            camera.position.y = feetY + EYE_H;
          } else {
            velocity.x = 0;
          }
        }
      }

      // Z 轴移动：同上
      var dzv = velocity.z * delta;
      if (dzv !== 0 && (wantsMove || hasHorizontalVelocity)) {
        var nzp = camera.position.z + dzv;
        var hitsZ = collideAt(camera.position.x, feetY, nzp);
        if (!hitsZ) {
          camera.position.z = nzp;
        } else {
          var stZ = stepTopFrom(hitsZ, feetY);
          if (stZ !== null && !collideAt(camera.position.x, stZ, nzp)) {
            camera.position.z = nzp;
            feetY = stZ;
            camera.position.y = feetY + EYE_H;
          } else {
            velocity.z = 0;
          }
        }
      }

      // 垂直：落地 / 撞头 / 水面托底
      var dyv = velocity.y * delta;
      var nfy = feetY + dyv;
      if (dyv <= 0) {
        var landY = null;
        var hitsV = collideAt(camera.position.x, nfy, camera.position.z);
        if (hitsV) {
          for (var hi = 0; hi < hitsV.length; hi++) {
            var tTop = hitsV[hi].y1;
            if (tTop <= feetY + 0.001 && (landY === null || tTop > landY)) landY = tTop;
          }
        }
        if (landY !== null) {
          feetY = landY; velocity.y = 0; canJump = true;      // 站在方块顶
        } else if (nfy < 0) {
          feetY = 0; velocity.y = 0; canJump = true;          // 湖面可行走
        } else {
          feetY = nfy; canJump = false;                        // 下落中
        }
      } else {
        var hitsU = collideAt(camera.position.x, nfy, camera.position.z);
        if (hitsU) {
          var ceilY = Infinity;
          for (var hj = 0; hj < hitsU.length; hj++) ceilY = Math.min(ceilY, hitsU[hj].y0);
          feetY = ceilY - PLAYER_H;                            // 撞到头顶方块
          velocity.y = 0;
        } else {
          feetY = nfy;
        }
      }
      camera.position.y = feetY + EYE_H;

      if (keys.space && canJump) {
        velocity.y = jumpSpeed;
        canJump = false;
      }

      // 活动范围限制
      var rr = Math.sqrt(camera.position.x * camera.position.x + camera.position.z * camera.position.z);
      if (rr > 130) {
        camera.position.x *= 130 / rr;
        camera.position.z *= 130 / rr;
      }
    }
  }

  // 水电梯：走进 3×3 井道中心水流会被推上天空之城（不依赖鼠标锁定）
  if (elevatorShaft) {
    var dx = camera.position.x - elevatorShaft.x;
    var dz = camera.position.z - elevatorShaft.z;
    if (dx * dx + dz * dz < elevatorShaft.radius * elevatorShaft.radius) {
      var feetNow = camera.position.y - EYE_H;
      if (feetNow > -0.5 && feetNow < elevatorShaft.top - 1.0) {
        var liftY = camera.position.y + 9.0 * delta;
        liftY = Math.min(liftY, elevatorShaft.top + EYE_H - 0.1);
        camera.position.y = liftY;
        velocity.y = 9.0;
        canJump = true;
      }
    }
  }

  // 落樱更新
  updatePetals(delta);

  // FPS 计数
  frameCount++;
  var now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsSpan.textContent = frameCount;
    fpsDot.className = 'fps-dot' + (frameCount < 30 ? ' bad' : frameCount < 50 ? ' warn' : '');
    frameCount = 0;
    lastFpsTime = now;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  var rt = waterMirror.getRenderTarget();
  if (rt) rt.setSize(
    Math.floor(window.innerWidth * 0.25),
    Math.floor(window.innerHeight * 0.25)
  );
});
})();
</script>
